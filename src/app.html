<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>tracker</title>
		<!-- Preserve browser data from before the tracker rename (tracey → relay → kcal → tracker)
		     before app modules load. Newest name first, so its data wins. Old keys go once
		     moved, so something the app later deletes can't come back from them. -->
		<script>
			try {
				var keys = Object.keys(localStorage);
				for (var prefix of ['kcal-', 'kcal.', 'relay-', 'tracey-']) {
					for (var key of keys) {
						if (!key.startsWith(prefix)) continue;
						// keeps the separator: kcal-plan → tracker-plan, kcal.headLine → tracker.headLine
						var nextKey = 'tracker' + key.slice(prefix.length - 1);
						if (localStorage.getItem(nextKey) === null) {
							localStorage.setItem(nextKey, localStorage.getItem(key));
						}
						localStorage.removeItem(key);
					}
				}
			} catch (e) {
				// Storage may be unavailable; the app still works for this session.
			}
		</script>
		<!-- theme + text size applied before first paint, so a dark-mode
		     reload never flashes the light palette. Mirrors the storage
		     shape in $lib/ui/settings.svelte.ts, change both together. -->
		<script>
			try {
				var s = JSON.parse(localStorage.getItem('tracker-settings') || '{}');
				var t = s.theme || 'light';
				if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
				var scales = { small: 0.9, normal: 1, large: 1.1, huge: 1.2 };
				document.documentElement.style.setProperty('--text-scale', scales[s.textSize] || 1);
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Netlify reads forms out of the deployed HTML at build time, and the
		     real feedback form lives inside a modal that isn't rendered until
		     the student opens settings. This hidden twin is what gets detected;
		     FeedbackForm.svelte posts to it by name. Keep the fields in step. -->
		<form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="feedback" />
			<input type="text" name="bot-field" />
			<textarea name="message"></textarea>
			<input type="text" name="plan" />
			<input type="text" name="credits" />
		</form>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
